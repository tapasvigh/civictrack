services:
  civic-track:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${CIVIC_TRACK_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/auth/status', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
